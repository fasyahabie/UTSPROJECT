<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kontak - Fahrel Fasyahabie</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <div class="brand">
        <a href="index.html" class="logo">FF</a>
        <span class="site-name">Fahrel Fasyahabie</span>
      </div>
      <button id="navToggle3" class="nav-toggle" aria-label="Buka navigasi">☰</button>
      <nav id="mainNav3" class="nav">
        <a href="index.html">Tentang Saya</a>
        <a href="portofolio.html">Proyek Saya</a>
        <a href="contact.html" class="active">Kontak</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1>Kontak</h1>
      <p class="lead">Silakan hubungi saya melalui email atau social media di bawah ini.</p>

      <ul class="contact-list">
        <li>Email: <a href="mailto:624c0008@student.mahardika.ac.id">emailkamu@example.com</a></li>
        <li>GitHub: <a href="https://Fasyahabie" target="_blank" rel="noopener">github.com/username</a></li>
        <li>LinkedIn: <a href="https://www.linkedin.com/in/username" target="_blank" rel="noopener">linkedin.com/in/username</a></li>
      </ul>

      <h2 class="mb-1">Form Kontak</h2>
      <form class="contact-form" onsubmit="return false;">
        <label>
          Nama
          <input class="input" type="text" name="nama" required placeholder="Nama lengkap">
        </label>
        <label>
          Email
          <input class="input" type="email" name="email" required placeholder="email@example.com">
        </label>
        <label>
          Pesan
          <textarea class="input textarea" name="pesan" required placeholder="Tulis pesan..."></textarea>
        </label>
        <button class="btn btn-primary" type="submit">Kirim (Demo)</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Fahrel Fasyahabie</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
